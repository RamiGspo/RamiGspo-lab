- name: Install RetroArch
  ansible.builtin.apt:
    name:
      - retroarch
      - unzip
      - acl  # lets Ansible become the unprivileged arcade user
      - rsync  # copies the local ROM collection
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow user to access GPU, sound and input devices
  ansible.builtin.user:
    name: "{{ retroarch_user }}"
    groups:
      - video
      - render
      - audio
      - input
    append: true

- name: Create cores directory
  become_user: "{{ retroarch_user }}"
  ansible.builtin.file:
    path: "{{ retroarch_cores_dir }}"
    state: directory
    mode: "0755"

- name: Download libretro cores
  become_user: "{{ retroarch_user }}"
  ansible.builtin.unarchive:
    src: "{{ retroarch_cores_url }}/{{ item }}_libretro.so.zip"
    dest: "{{ retroarch_cores_dir }}"
    remote_src: true
    creates: "{{ retroarch_cores_dir }}/{{ item }}_libretro.so"
  loop: "{{ retroarch_cores }}"

- name: Create ROM directories
  become_user: "{{ retroarch_user }}"
  ansible.builtin.file:
    path: "{{ retroarch_roms_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ retroarch_rom_systems }}"

- name: Download free homebrew games
  become_user: "{{ retroarch_user }}"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ retroarch_roms_dir }}/{{ item.system }}/{{ item.url | basename }}"
    mode: "0644"
  loop: "{{ retroarch_free_roms }}"

# Optional: without a local collection the arcade still has the homebrew games.
- name: Copy the local ROM collection
  ansible.builtin.include_tasks: roms.yml
  when: retroarch_roms_source is defined

- name: Install arcade settings
  become_user: "{{ retroarch_user }}"
  ansible.builtin.template:
    src: arcade.cfg.j2
    dest: "{{ retroarch_arcade_config }}"
    mode: "0644"
