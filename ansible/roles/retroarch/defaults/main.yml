retroarch_user: "{{ ansible_user }}"
retroarch_config_dir: "/home/{{ retroarch_user }}/.config/retroarch"
retroarch_cores_dir: "{{ retroarch_config_dir }}/cores"
retroarch_arcade_config: "{{ retroarch_config_dir }}/arcade.cfg"

# Button mappings for known gamepads. Debian ships none, so without them
# RetroArch reports pads as "not configured".
retroarch_autoconfig_repo: https://github.com/libretro/retroarch-joypad-autoconfig
retroarch_autoconfig_commit: 2e3b8a2728d5efd00fa0207d07ba2488b89e87b2
retroarch_autoconfig_dir: "{{ retroarch_config_dir }}/joypad-autoconfig"

# Debian disables the in-menu core updater, so cores come from the libretro buildbot.
retroarch_cores_url: "https://buildbot.libretro.com/nightly/linux/{{ ansible_facts['architecture'] }}/latest"
retroarch_cores:
  - nestopia  # NES
  - snes9x  # SNES
  - genesis_plus_gx  # Master System, Mega Drive/Genesis, Game Gear, Mega CD
  - fbneo  # Neo Geo and arcade boards
  - gambatte  # Game Boy, Game Boy Color
  - mgba  # Game Boy Advance
  - pcsx_rearmed  # PlayStation

retroarch_roms_dir: "/home/{{ retroarch_user }}/roms"
retroarch_rom_systems:
  - nes
  - snes
  - mastersystem
  - megadrive
  - gamegear
  - neogeo
  - arcade
  - gb
  - gbc
  - gba
  - psx

# Homebrew games their authors publish for free download on GitHub releases.
retroarch_free_roms:
  - system: megadrive
    url: https://github.com/andwn/cave-story-md/releases/download/v0.8.8/doukutsu-en.gen
  - system: gbc
    url: https://github.com/AntonioND/ucity/releases/download/v1.3/ucity.gbc
